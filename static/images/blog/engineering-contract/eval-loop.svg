<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="The eval loop for improving a skill" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The eval loop for improving a skill</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="860" height="330" rx="16" fill="#ffffff"/><rect x="330" y="40" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="430.0" y="72.9" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Change the skill</text><rect x="560" y="135" width="200" height="56" rx="10" fill="#fff0f5" stroke="#fd2d78" stroke-width="1.5"/><text x="660.0" y="167.9" font-size="14" fill="#fd2d78" font-weight="600" text-anchor="middle">Run the eval set</text><rect x="330" y="230" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="430.0" y="262.9" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Compare the score</text><rect x="100" y="135" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="200.0" y="167.9" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Keep or revert</text><path d="M530,68 C610,68 660,90 660,133" fill="none" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><path d="M660,191 C660,240 610,258 532,258" fill="none" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><path d="M330,258 C250,258 200,240 200,193" fill="none" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><path d="M200,135 C200,90 250,68 328,68" fill="none" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><text x="430" y="152" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">5 real tasks</text><text x="430" y="170" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">+ expected results</text><text x="430" y="188" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">+ a script to check them</text><text x="430" y="318" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">Without evals, every edit to a skill is a guess.</text></svg>
