eaf1fb" stroke="#205295" stroke-width="1.5"/><text x="573.0" y="167.25" font-size="15" fill="#205295" font-weight="600" text-anchor="middle">MEMORIES.md</text><text x="573.0" y="187.25" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">size budget</text><text x="573.0" y="207.25" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">expiry rule</text><rect x="700" y="40" width="140" height="60" rx="10" fill="#eaf1fb" stroke="#205295" stroke-width="1.5"/><text x="770.0" y="65.4" font-size="14" fill="#205295" font-weight="600" text-anchor="middle">AGENTS.md</text><text x="770.0" y="84.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">if universal</text><rect x="700" y="152" width="140" height="60" rx="10" fill="#fff0f5" stroke="#fd2d78" stroke-width="1.5"/><text x="770.0" y="177.4" font-size="14" fill="#fd2d78" font-weight="600" text-anchor="middle">A skill</text><text x="770.0" y="196.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">if task-specific</text><rect x="700" y="264" width="140" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 4"/><text x="770.0" y="289.4" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Deleted</text><text x="770.0" y="308.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">when code changes</text><line x1="658" y1="165" x2="698" y2="75" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><line x1="658" y1="182" x2="698" y2="182" stroke="#fd2d78" stroke-width="2" marker-end="url(#afd2d78)"/><line x1="658" y1="200" x2="698" y2="292" stroke="#6b7280" stroke-width="2" marker-end="url(#a6b7280)"/><text x="430" y="360" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">Memory is the inbox. The other contracts are where knowledge goes once it is proven.</text></svg>
