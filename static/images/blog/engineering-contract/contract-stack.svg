<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="The engineering contract stack" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The engineering contract stack</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="860" height="440" rx="16" fill="#ffffff"/><text x="60" y="42" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">CONTRACT</text><text x="330" y="42" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">LIVES IN</text><text x="580" y="42" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">WHEN IT APPLIES</text><rect x="40" y="60" width="780" height="58" rx="10" fill="#ffffff" stroke="#205295" stroke-width="2"/><rect x="40" y="60" width="10" height="58" rx="4" fill="#205295" stroke="#205295" stroke-width="0"/><text x="66" y="95" font-size="16" fill="#205295" font-weight="700" text-anchor="start">1. System contract</text><text x="330" y="95" font-size="14" fill="#1f2937" font-weight="500" text-anchor="start">AGENTS.md</text><text x="580" y="95" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Every session · changes rarely</text><rect x="40" y="132" width="780" height="58" rx="10" fill="#ffffff" stroke="#4a4d9a" stroke-width="2"/><rect x="40" y="132" width="10" height="58" rx="4" fill="#4a4d9a" stroke="#4a4d9a" stroke-width="0"/><text x="66" y="167" font-size="16" fill="#4a4d9a" font-weight="700" text-anchor="start">2. Skill contracts</text><text x="330" y="167" font-size="14" fill="#1f2937" font-weight="500" text-anchor="start">skills/&lt;name&gt;/SKILL.md</text><text x="580" y="167" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Loaded per task type</text><rect x="40" y="204" width="780" height="58" rx="10" fill="#ffffff" stroke="#76489e" stroke-width="2"/><rect x="40" y="204" width="10" height="58" rx="4" fill="#76489e" stroke="#76489e" stroke-width="0"/><text x="66" y="239" font-size="16" fill="#76489e" font-weight="700" text-anchor="start">3. Memory contract</text><text x="330" y="239" font-size="14" fill="#1f2937" font-weight="500" text-anchor="start">MEMORIES.md</text><text x="580" y="239" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Grows, gets reviewed and pruned</text><rect x="40" y="276" width="780" height="58" rx="10" fill="#ffffff" stroke="#b13d8c" stroke-width="2"/><rect x="40" y="276" width="10" height="58" rx="4" fill="#b13d8c" stroke="#b13d8c" stroke-width="0"/><text x="66" y="311" font-size="16" fill="#b13d8c" font-weight="700" text-anchor="start">4. Plan contract</text><text x="330" y="311" font-size="14" fill="#1f2937" font-weight="500" text-anchor="start">docs/plans/&lt;feature&gt;.md</text><text x="580" y="311" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">One per feature</text><rect x="40" y="348" width="780" height="58" rx="10" fill="#ffffff" stroke="#fd2d78" stroke-width="2"/><rect x="40" y="348" width="10" height="58" rx="4" fill="#fd2d78" stroke="#fd2d78" stroke-width="0"/><text x="66" y="383" font-size="16" fill="#fd2d78" font-weight="700" text-anchor="start">5. Review &amp; escalation</text><text x="330" y="383" font-size="14" fill="#1f2937" font-weight="500" text-anchor="start">Review tiers + plan §11</text><text x="580" y="383" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Every PR, every blocker</text><text x="430" y="428" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Top: most stable, reused everywhere  →  Bottom: most specific, closest to each change</text></svg>
