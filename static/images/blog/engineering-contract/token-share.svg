<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Input tokens now dominate token volume and cost" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Input tokens now dominate token volume and cost</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="860" height="330" rx="16" fill="#ffffff"/><text x="40" y="40" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Input tokens as a share of input + output, Jan → Apr 2026 (data shared in the talk)</text><text x="40" y="82" font-size="14" fill="#205295" font-weight="700" text-anchor="start">Token volume</text><text x="40" y="114" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start">Jan 2026</text><rect x="200" y="94" width="600" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><rect x="200" y="94" width="491.4" height="30" rx="6" fill="#7f9cc7" stroke="#7f9cc7" stroke-width="0"/><text x="683.4" y="114" font-size="13" fill="#ffffff" font-weight="700" text-anchor="end">81.9%</text><text x="40" y="152" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start">Apr 2026</text><rect x="200" y="132" width="600" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><rect x="200" y="132" width="551.4" height="30" rx="6" fill="#205295" stroke="#205295" stroke-width="0"/><text x="743.4" y="152" font-size="13" fill="#ffffff" font-weight="700" text-anchor="end">91.9%</text><text x="40" y="198" font-size="14" fill="#fd2d78" font-weight="700" text-anchor="start">Token cost (price-equivalent)</text><text x="40" y="230" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start">Jan 2026</text><rect x="200" y="210" width="600" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><rect x="200" y="210" width="285.0" height="30" rx="6" fill="#fca5c4" stroke="#fca5c4" stroke-width="0"/><text x="477.0" y="230" font-size="13" fill="#ffffff" font-weight="700" text-anchor="end">47.5%</text><text x="40" y="268" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start">Apr 2026</text><rect x="200" y="248" width="600" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><rect x="200" y="248" width="417.0" height="30" rx="6" fill="#fd2d78" stroke="#fd2d78" stroke-width="0"/><text x="609.0" y="268" font-size="13" fill="#ffffff" font-weight="700" text-anchor="end">69.5%</text><text x="430" y="312" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">Input keeps taking a bigger share of spend, even though input tokens are cheaper per unit.</text></svg>
