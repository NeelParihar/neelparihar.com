<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="A phased rollout of the contract stack" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A phased rollout of the contract stack</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="900" height="280" rx="16" fill="#ffffff"/><line x1="60" y1="70" x2="840" y2="70" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/><circle cx="150" cy="70" r="11" fill="#205295"/><text x="150" y="46" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">Weeks 1–2</text><rect x="60" y="100" width="180" height="150" rx="10" fill="#fff" stroke="#205295" stroke-width="1.5"/><text x="150.0" y="150.25" font-size="15" fill="#205295" font-weight="600" text-anchor="middle">Foundation</text><text x="150.0" y="170.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">one repo</text><text x="150.0" y="190.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">short AGENTS.md</text><text x="150.0" y="210.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">no agent merges</text><circle cx="350" cy="70" r="11" fill="#5a4b9c"/><text x="350" y="46" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">Weeks 3–6</text><rect x="260" y="100" width="180" height="150" rx="10" fill="#fff" stroke="#5a4b9c" stroke-width="1.5"/><text x="350.0" y="150.25" font-size="15" fill="#5a4b9c" font-weight="600" text-anchor="middle">Plans</text><text x="350.0" y="170.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">plan.md required</text><text x="350.0" y="190.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">humans write §1–4</text><text x="350.0" y="210.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">track rejections</text><circle cx="550" cy="70" r="11" fill="#a3418f"/><text x="550" y="46" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">Weeks 6–10</text><rect x="460" y="100" width="180" height="150" rx="10" fill="#fff" stroke="#a3418f" stroke-width="1.5"/><text x="550.0" y="150.25" font-size="15" fill="#a3418f" font-weight="600" text-anchor="middle">Skills + memory</text><text x="550.0" y="170.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">top 2–3 skills</text><text x="550.0" y="190.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">evals per skill</text><text x="550.0" y="210.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">reviewed memory</text><circle cx="750" cy="70" r="11" fill="#fd2d78"/><text x="750" y="46" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">Ongoing</text><rect x="660" y="100" width="180" height="150" rx="10" fill="#fff" stroke="#fd2d78" stroke-width="1.5"/><text x="750.0" y="150.25" font-size="15" fill="#fd2d78" font-weight="600" text-anchor="middle">Scale</text><text x="750.0" y="170.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">review tiers</text><text x="750.0" y="190.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">always-on agents</text><text x="750.0" y="210.25" font-size="13" fill="#1f2937" font-weight="400" text-anchor="middle">next repo</text></svg>
