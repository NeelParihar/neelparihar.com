<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Escalation and review flow" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Escalation and review flow</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="860" height="400" rx="16" fill="#ffffff"/><rect x="40" y="40" width="200" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="140.0" y="72.9" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Agent works a plan step</text><line x1="240" y1="68" x2="298" y2="68" stroke="#6b7280" stroke-width="2" marker-end="url(#a6b7280)"/><rect x="300" y="30" width="230" height="76" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="415.0" y="53.9" font-size="14" fill="#b45309" font-weight="600" text-anchor="middle">Hits a trigger?</text><text x="415.0" y="72.9" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">never-touch, new dependency,</text><text x="415.0" y="91.9" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">failed criterion, irreversible</text><line x1="530" y1="68" x2="598" y2="68" stroke="#fd2d78" stroke-width="2" marker-end="url(#afd2d78)"/><text x="564.0" y="60" font-size="12" fill="#fd2d78" font-weight="400" text-anchor="middle">yes</text><rect x="600" y="40" width="220" height="56" rx="10" fill="#fff0f5" stroke="#fd2d78" stroke-width="1.5"/><text x="710.0" y="72.9" font-size="14" fill="#fd2d78" font-weight="600" text-anchor="middle">Stop, update plan, ask</text><line x1="710" y1="96" x2="710" y2="148" stroke="#fd2d78" stroke-width="2" marker-end="url(#afd2d78)"/><rect x="600" y="150" width="220" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="710.0" y="173.4" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Human decides</text><text x="710.0" y="192.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">and updates a contract</text><path d="M600,178 C420,178 180,178 140,100" fill="none" stroke="#fd2d78" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#afd2d78)"/><line x1="415" y1="106" x2="415" y2="238" stroke="#6b7280" stroke-width="2" marker-end="url(#a6b7280)"/><text x="404" y="150" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">no</text><rect x="300" y="240" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="415.0" y="272.9" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Open PR (never merge)</text><line x1="415" y1="296" x2="415" y2="326" stroke="#6b7280" stroke-width="2" marker-end="url(#a6b7280)"/><rect x="80" y="328" width="700" height="52" rx="10" fill="#eaf1fb" stroke="#205295" stroke-width="1.5"/><text x="430.0" y="358.55" font-size="13" fill="#205295" font-weight="600" text-anchor="middle">Review tier: low → any reviewer · standard → check vs plan · high → area owner</text></svg>
