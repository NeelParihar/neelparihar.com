<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Contracts not essays: what a bloated system contract costs" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Contracts not essays: what a bloated system contract costs</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="860" height="300" rx="16" fill="#ffffff"/><text x="430" y="38" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">Same context window, two system contracts (illustrative)</text><text x="40" y="70" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Essay-style AGENTS.md (hundreds of soft rules)</text><rect x="40" y="80" width="780" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><rect x="40" y="80" width="430" height="46" rx="8" fill="#fd2d78" stroke="#fd2d78" stroke-width="0"/><text x="255.0" y="108" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">system contract</text><text x="645.0" y="108" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">room for the task, the code and the plan</text><text x="40" y="170" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Contract-style AGENTS.md (a few sharp rules)</text><rect x="40" y="180" width="780" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><rect x="40" y="180" width="110" height="46" rx="8" fill="#205295" stroke="#205295" stroke-width="0"/><text x="95.0" y="208" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">contract</text><text x="485.0" y="208" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">room for the task, the code and the plan</text><text x="430" y="272" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">The system contract is paid for on every session, by every engineer, before any work starts.</text></svg>
