<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="The plan.md workflow" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The plan.md workflow</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="900" height="360" rx="16" fill="#ffffff"/><rect x="20" y="30" width="860" height="130" rx="12" fill="#eaf1fb" stroke="#205295" stroke-width="1.5"/><text x="40" y="56" font-size="12" fill="#205295" font-weight="700" text-anchor="start">HUMAN</text><rect x="20" y="190" width="860" height="130" rx="12" fill="#fff0f5" stroke="#fd2d78" stroke-width="1.5"/><text x="40" y="216" font-size="12" fill="#fd2d78" font-weight="700" text-anchor="start">AGENT</text><rect x="40" y="74" width="150" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="115.0" y="101.4" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">1. Write §1–4</text><text x="115.0" y="120.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">intent, criteria</text><rect x="250" y="234" width="150" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="325.0" y="261.4" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">2. Draft §5–11</text><text x="325.0" y="280.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">read-only</text><rect x="440" y="70" width="150" height="72" rx="10" fill="#fff" stroke="#205295" stroke-width="1.5"/><text x="515.0" y="101.4" font-size="14" fill="#205295" font-weight="600" text-anchor="middle">3. Plan review</text><text x="515.0" y="120.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">the quality gate</text><rect x="640" y="234" width="150" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="715.0" y="261.4" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">4. Implement</text><text x="715.0" y="280.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">step by step</text><rect x="690" y="74" width="170" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="775.0" y="101.4" font-size="14" fill="#1f2937" font-weight="600" text-anchor="middle">6. Verify vs §3</text><text x="775.0" y="120.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">merge + memory</text><line x1="190" y1="106" x2="248" y2="250" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><line x1="400" y1="262" x2="438" y2="118" stroke="#fd2d78" stroke-width="2" marker-end="url(#afd2d78)"/><line x1="590" y1="106" x2="638" y2="250" stroke="#205295" stroke-width="2" marker-end="url(#a205295)"/><line x1="790" y1="250" x2="788" y2="140" stroke="#fd2d78" stroke-width="2" marker-end="url(#afd2d78)"/><rect x="430" y="236" width="170" height="60" rx="10" fill="#fff" stroke="#fd2d78" stroke-width="1.5" stroke-dasharray="6 4"/><text x="515.0" y="261.4" font-size="14" fill="#fd2d78" font-weight="600" text-anchor="middle">5. Escalate?</text><text x="515.0" y="280.4" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">stop and ask</text><line x1="640" y1="280" x2="602" y2="280" stroke="#fd2d78" stroke-width="2" marker-end="url(#afd2d78)"/><text x="515" y="342" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">Review the one-page plan, then check the PR against it. Not the other way round.</text></svg>
