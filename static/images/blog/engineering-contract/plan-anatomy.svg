<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 476" width="860" height="476" role="img" aria-label="Anatomy of a plan.md: who writes each section" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Anatomy of a plan.md: who writes each section</title><defs><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a205295" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#205295"/></marker><marker id="afd2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fd2d78"/></marker><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="860" height="476" rx="16" fill="#ffffff"/><text x="430" y="40" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">plan.md</text><rect x="40" y="62" width="780" height="80" rx="10" fill="#eaf1fb" stroke="#205295" stroke-width="1.5"/><text x="60" y="90" font-size="13" fill="#205295" font-weight="700" text-anchor="start">Written by a human: intent</text><rect x="60" y="102" width="178" height="30" rx="10" fill="#ffffff" stroke="#205295" stroke-width="1.5"/><text x="149.0" y="121.2" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">1. Context</text><rect x="250" y="102" width="178" height="30" rx="10" fill="#ffffff" stroke="#205295" stroke-width="1.5"/><text x="339.0" y="121.2" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">2. Goal and non-goals</text><rect x="440" y="102" width="178" height="30" rx="10" fill="#ffffff" stroke="#205295" stroke-width="1.5"/><text x="529.0" y="121.2" font-size="12" fill="#1f2937" font-