.5"/><text x="339.0" y="313.2" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">10. Risks, rollout, rollback</text><rect x="440" y="294" width="178" height="30" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="529.0" y="313.2" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">11. Escalation triggers</text><rect x="40" y="350" width="780" height="80" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="60" y="378" font-size="13" fill="#b45309" font-weight="700" text-anchor="start">Filled in by both during the work</text><rect x="60" y="390" width="178" height="30" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="149.0" y="409.2" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">12. Open questions</text><rect x="250" y="390" width="178" height="30" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="339.0" y="409.2" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">13. Decision log → memory</text><text x="430" y="458" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">If an agent writes section 3, it is grading its own homework.</text></svg>
